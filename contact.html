<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Bibek Dahal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <p class="site-title"><a href="index.html">Bibek Dahal</a></p>
    <nav class="site-nav">
      <a href="index.html">About</a>
      <a href="cv.html">CV</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main class="wrap">
    <h1>Contact me</h1>
    <p>
      If you have any inquiries, feedback, or collaboration opportunities,
      fill out the form below and I'll get back to you as soon as possible.
    </p>

    <form
      name="contactForm"
      class="contact-form"
      action="https://formspree.io/f/moevpjnp"
      method="POST"
      onsubmit="return validateForm()"
    >

      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="field">
        <label for="purpose">Purpose</label>
        <select id="purpose" name="purpose">
          <option value="inquiry">Inquiry</option>
          <option value="feedback">Feedback</option>
          <option value="collaboration">Collaboration</option>
        </select>
      </div>

      <div class="field">
        <label for="phone">Phone number (optional)</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
      </div>

      <div class="field">
        <label for="collaboration">Collaboration area (optional)</label>
        <select id="collaboration" name="collaboration">
          <option value="web_development">Web Development</option>
          <option value="cybersecurity">Cybersecurity</option>
          <option value="video_editing">Video Editing</option>
        </select>
      </div>

      <div class="field">
        <label for="additional_info">Additional information (optional)</label>
        <input type="text" id="additional_info" name="additional_info" placeholder="Anything else I should know">
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Enter your message" required></textarea>
      </div>

      <button type="submit" class="submit">Send message</button>


    </form>

    <script>
      function validateForm() {
        var name = document.forms["contactForm"]["name"].value;
        var email = document.forms["contactForm"]["email"].value;
        var message = document.forms["contactForm"]["message"].value;

        if (name === "" || email === "" || message === "") {
          alert("Name, Email, and Message fields must be filled out.");
          return false;
        }
        return true;
      }
    </script>

  </main>

  <footer class="site-footer">
    © 2026 Bibek Dahal
  </footer>

</body>
</html>
